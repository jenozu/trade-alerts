metadata:
  config_version: "0.1.0-reconstructed"
  description: "NQ futures session definitions for historical research. Reconstructed from conversation specifications."

timezones:
  storage: "UTC"
  trading: "America/New_York"

sessions:
  globex:
    start: "18:00"
    end: "17:00"
    description: "CME equity-index futures trading session; session date rolls at 18:00 ET."
  rth:
    start: "09:30"
    end: "16:00"
    description: "US regular trading hours."
  premarket:
    start: "04:00"
    end: "09:30"
  overnight:
    start: "18:00"
    end: "09:30"
  london:
    start: "02:00"
    end: "05:00"
    provisional: true
    note: "London window is intentionally provisional and must be validated before production use."
  strategy_window:
    start: "09:30"
    end: "10:30"
    new_entries_only: true

previous_day_levels:
  reference_session: "rth"
  high_name: "pdh"
  low_name: "pdl"
  available_from: "09:30"

opening_ranges:
  start: "09:30"
  durations_minutes: [5, 15, 30]
  availability:
    or5: "09:35"
    or15: "09:45"
    or30: "10:00"

level_availability:
  pmh_pml: "09:30"
  onh_onl: "09:30"
  loh_lol: "05:00"
  rth_open: "09:30"

vwap:
  reset: "rth_open"
  reset_time: "09:30"

timeframes:
  master: "1m"
  generated: ["5m", "15m", "30m", "1h", "4h", "1d"]

validation:
  expected_base_interval_minutes: 1
  allow_zero_volume_bars: true
  treat_exchange_closures_as_expected: false
  note: "Session-aware gap classification is a later validation enhancement."
