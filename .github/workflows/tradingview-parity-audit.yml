name: TradingView MSS-FVG parity audit (feature only)

on:
  push:
    branches:
      - feature/tradingview-pinescript
    paths:
      - tradingview/audit/**
      - tradingview/tests/**
      - tradingview/backtests/reversal_v2_diagnostics_protocol.md
      - .github/workflows/tradingview-parity-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "PyYAML>=6,<7" "pytest>=8,<10"
      - name: Check diagnostic V2 source parity + canonical MSS/FVG auditor
        run: |
          python -m pytest -q tradingview/tests/test_v2_diagnostics_source_parity.py tradingview/tests/test_compare_mss_fvg.py
